services:
  abs-tools:
    image: ghcr.io/colinagnew/abs-tools:latest
    container_name: abs-tools
    env_file: .env
    user: "1000:1000"
    environment:
      # Enable/disable tools
      - ENABLE_AUTO_MATCH=true
      - ENABLE_CHAPTER_MATCH=true
      - ENABLE_EPUB_CONVERT=true
      # Schedules (cron format)
      - SCHEDULE_AUTO_MATCH=0 * * * *
      - SCHEDULE_CHAPTER_MATCH=5 * * * *
      - SCHEDULE_EPUB_CONVERT=10 * * * *
      - SCHEDULE_EPUB_CONVERT_FULL=30 2 * * 0
      # Auto-match providers (optional — uses google if not set)
      # Built-in: audible, audible.com, audible.ca, audible.co.uk, audible.com.au, audible.de, audible.fr, audible.co.jp, audible.it, audible.in, audible.es, google, openlibrary
      # Custom providers: custom-<id>  (find IDs at GET /api/custom-metadata-providers)
      # - AUTOMATCH_PROVIDER_AUDIOBOOKS=audible
      # - AUTOMATCH_PROVIDER_AUDIOBOOKS_FALLBACK=custom-<id>
      # - AUTOMATCH_PROVIDER_EBOOKS=custom-<id>
      # - AUTOMATCH_PROVIDER_EBOOKS_FALLBACK=custom-<id>
      # Batching — prevents rate limits from custom providers on large libraries
      # - AUTOMATCH_BATCH_SIZE=25
      # - AUTOMATCH_BATCH_DELAY=10
      # - AUTOMATCH_FALLBACK_DELAY=60
      # epub-convert paths
      - EBOOKS_DIR=/ebooks
      - ABS_EBOOKS_PREFIX=/ebooks
      # Chapter match tuning
      - CHAPTER_THRESHOLD=3
      - CHAPTER_PROVIDER=audible.com
      - CHAPTER_REGION=US
      - SEARCH_FOR_ASIN=true
      - USE_TRACKS_AS_CHAPTERS=false
      - DISABLE_RATE_PROTECTION=false
    restart: unless-stopped
    # Uncomment to persist logs and state outside the container:
    # volumes:
    #   - ./logs:/var/log/abs-tools
    #   - ./data:/var/lib/abs-tools
    # Uncomment if using epub-convert (mount your ebooks directory to /ebooks):
    #   - /path/to/your/ebooks:/ebooks
