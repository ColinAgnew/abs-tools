services:
  abs-tools:
    image: ghcr.io/colinagnew/abs-tools:latest
    container_name: abs-tools
    env_file: .env
    restart: unless-stopped
    # Uncomment to persist logs and state outside the container:
    # volumes:
    #   - ./logs:/var/log/abs-tools
    #   - ./data:/var/lib/abs-tools
    # Uncomment if using epub-convert (set EBOOKS_DIR=/ebooks in .env):
    #   - /path/to/your/ebooks:/ebooks
